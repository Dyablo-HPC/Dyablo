[run]
tEnd=0.2
nStepmax=-1
output_timeslice=0.001

initial_conditions=double_mach

[dt]
hydro_cfl=0.8

[amr]
level_min=4
level_max=14
coarse_oct_resolution_x=14
coarse_oct_resolution_y=4

bx=4
by=4


loadbalance_coherent_levels=2

markers_kernel=RefineCondition_pseudo_gradient
epsilon_refine=0.05
epsilon_coarsen=0.01

load_balancing_frequency=1000000
cycle_frequency=1

[mesh]
ndim=2

xmin=0.0
xmax=4.0

ymin=0.0
ymax=1.0

[hydro]
gamma0=1.4
riemann=hllc
boundary_conditions=double_mach
update=HydroUpdate_RK2

[output]
outputDir=./
outputPrefix=double_mach
write_variables=rho,rho_vx,rho_vy,e_tot,level
