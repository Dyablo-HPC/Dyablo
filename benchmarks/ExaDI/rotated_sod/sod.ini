[run]                
tend=0.25
initial_conditions=sod                 
nstepmax=100000
output_timeslice=0.25

[dt]
hydro_cfl=0.8

[amr]
level_min=3
level_max=6

bx=4                   
by=4                                   

markers_kernel=RefineCondition_pseudo_gradient
epsilon_coarsen=0.005                
epsilon_refine=0.01                
cycle_frequency=1                

load_balancing_frequency=50                  

nboctspergroup=1024

[hydro]                
gamma0=1.666               
update=HydroUpdate_RK2

[mesh]
ndim=2

xmin=0.0                 
xmax=1.0                 
ymin=0.0                 
ymax=1.0

boundary_type_xmax=absorbing          
boundary_type_xmin=absorbing          
boundary_type_ymax=absorbing
boundary_type_ymin=absorbing

[sod]
# 30°
#angle=0.5235987755982988

# 45°
angle=0.7853981633974483

#Default sod
#angle=0.0

[output]
outputdir=./                  
outputprefix=rotated_sod
write_variables=rho,rho_vx,rho_vy,e_tot,level