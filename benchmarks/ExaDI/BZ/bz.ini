[run]
tEnd=1.0
nStepmax=1000000
output_timeslice=0.01
initial_conditions=BZ

[dt]
dt_kernel=Compute_dt_fixed
fixed_dt=1.0e-6

[amr]
level_min=2
level_max=10

bx=4
by=4

loadbalance_coherent_levels=2

markers_kernel=RefineCondition_pseudo_gradient_BZ
epsilon_refine=0.1
epsilon_coarsen=0.05

load_balancing_frequency=100
cycle_frequency=1

[mesh]
ndim=2

xmin=0.0
xmax=1.0

ymin=0.0
ymax=1.0

boundary_type_xmin=absorbing
boundary_type_xmax=absorbing

boundary_type_ymin=absorbing
boundary_type_ymax=absorbing

[hydro]
update=none

[source_terms]
updates=SourceUpdate_BZ

[output]
outputDir=./
outputPrefix=test_BZ
write_variables=a,b,c,level
